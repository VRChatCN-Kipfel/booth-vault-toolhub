# Release 发布：消费 ci.yml 的构建产物，做 NSIS 打包并发布。
#
# 触发方式：
#   1. workflow_run：ci.yml（tag 触发）成功后自动 → 发布正式版
#   2. workflow_dispatch：手动 → 发布预发布
#
# 正式版：git tag v* 推送 → ci 构建 → release 打包 → 发正式版
# 预发布：手动触发勾选 prerelease，或 tag 含连字符（v1.0.0-rc.1）
#
# 打包产物始终上传为工件（即使不发布，也便于他人取得即时测试产物）。

name: release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.0.0）"
        required: false
        default: "v0.1.0"
      prerelease:
        description: "标记为预发布"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 解析版本号与预发布标志
      # workflow_run：ci 由 tag 触发时 head_branch 即 tag 名（如 v0.1.0）
      # 手动触发：用输入 tag
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            REF="${{ github.event.workflow_run.head_branch }}"
          else
            REF="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$REF" ]; then REF="v0.1.0"; fi
          # 预发布：tag 含 '-'（semver 预发布段）
          IS_PRERELEASE="false"
          case "$REF" in
            *-*) IS_PRERELEASE="true" ;;
          esac
          # 手动触发勾选 prerelease 时强制预发布
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            IS_PRERELEASE="true"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      # 下载 ci 构建的 booth 三二进制
      - name: Download booth binaries
        uses: actions/download-artifact@v4
        with:
          name: booth-binaries
          path: binaries

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend deps
        working-directory: gui
        run: npm ci

      # 把 ci 产物放回 release target，交给 tauri 打包（NSIS 安装包）
      - name: Stage binaries into workspace
        shell: bash
        run: |
          mkdir -p target/release
          cp binaries/booth.exe target/release/booth.exe
          cp binaries/booth-mcp.exe target/release/booth-mcp.exe
          cp binaries/booth-shell.exe target/release/booth-shell.exe

      # 构建前端 + tauri bundle（NSIS 等安装包）
      - name: Build frontend
        working-directory: gui
        run: npm run build
      - name: Build GUI bundle
        working-directory: gui
        run: npm run tauri build

      # 上传打包产物（NSIS 安装包等）——即使不发布也保留供即时测试
      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: booth-packages
          path: |
            gui/src-tauri/target/release/bundle/**
          if-no-files-found: warn
          retention-days: 30

      # 发布：tag 触发（workflow_run，head_branch 为 tag）或手动触发都发布；
      # 正式/预发布由版本号决定。
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            gui/src-tauri/target/release/bundle/**/*.exe
            gui/src-tauri/target/release/bundle/**/*.msi
