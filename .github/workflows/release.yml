# Release 发布：消费 CI 的三架构 booth 二进制，做最终打包（安装器 + 便携版）并发布。
#
# 职责划分：
#   CI   = 测试门控 + 构建三架构 booth 二进制（副产品，供 release 用）
#   release = 最终产物生产：tauri bundle（MSI/NSIS）+ 便携版组装 + 创建 Release
#
# CI 每架构上传 booth-binaries-{platform}-{arch}（三二进制 + version.txt；macOS 无 booth-shell）。
# release 下载对应架构工件 → 本地构建 GUI → 打包安装器 + 便携版 → 聚合发布。
#
# 触发：
#   1. workflow_run：CI 完成后自动
#   2. workflow_dispatch：手动（输入 tag + 勾选 prerelease）
# 发布条件：
#   - version.txt 含 v* tag → 创建 Release（tag 含 - 为预发布）
#   - 手动触发 → 创建 Release
#   - 普通 push（version.txt 空）→ 不创建（只产成品工件）

name: release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（必填，如 v1.0.0）"
        required: true
      prerelease:
        description: "标记为预发布"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    # 仅当触发源 CI 成功时才运行（workflow_run 判断上游结论；手动触发直接跑）。
    # 防止 CI 失败或进行中时误触发发布流。
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows (x64 / x86 / arm64) ----
          - platform: windows
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            msvc_arch: x64
            runs_on: windows-latest
            wv2: x64
            msi: true
            portable: true
          - platform: windows
            arch: x86
            rust_target: i686-pc-windows-msvc
            msvc_arch: amd64_x86
            runs_on: windows-latest
            wv2: x86
            msi: true
            portable: true
          - platform: windows
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            runs_on: windows-11-arm
            wv2: arm64
            msi: false
            portable: true
          # ---- macOS (arm64 / x64) ----
          - platform: macos
            arch: arm64
            rust_target: aarch64-apple-darwin
            runs_on: macos-latest
            msi: false
            portable: false
          - platform: macos
            arch: x64
            rust_target: x86_64-apple-darwin
            runs_on: macos-26-intel
            msi: false
            portable: false
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      # 解析 CI 运行 ID：workflow_run 直接用上游运行；workflow_dispatch 取所选分支上
      # 最近一次 CI push 运行，查不到则失败（与下载失败同等处理）。
      - name: Resolve CI run ID
        id: ci-run
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ci_run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh api "/repos/${{ github.repository }}/actions/runs?event=push&branch=${{ github.ref_name }}&workflow_id=ci.yml&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
            if [ -z "$RUN_ID" ]; then
              echo "::error::未找到分支 ${{ github.ref_name }} 上最近的 CI 运行，无法获取 booth 二进制"
              exit 1
            fi
            echo "ci_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi

      # 下载 CI 构建的对应平台/架构 booth 二进制；缺失即失败，不产出残缺包
      - name: Download booth binaries
        uses: actions/download-artifact@v4
        with:
          name: booth-binaries-${{ matrix.platform }}-${{ matrix.arch }}
          path: binaries
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.ci-run.outputs.ci_run_id }}

      # 配置 MSVC 开发环境（仅 Windows；tauri build 多架构需要，x86 用 VS amd64_x86 交叉工具集）
      - name: Enable Developer Command Prompt
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend deps
        working-directory: gui
        run: npm ci

      # ---- 支持作者栏位注入（每作者一个 secret，值为完整 raw JSON，图片 base64 内嵌 data: URL）----
      #   AUTHOR_1_JSON: {"name":"主上","title":"LinnYue","desc":"...","avatar":"data:image/png;base64,...","links":[{"url":"...","label":"爱发电"}],"image":"data:image/png;base64,..."}
      #   AUTHOR_2_JSON: {"name":"作者B","image":"data:image/png;base64,..."}
      #   AUTHOR_3_JSON: {"name":"作者C","image":"data:image/png;base64,..."}
      #   SUPPORT_NOTE:  底部说明文字（可选，覆盖内置文案）
      # 未配置 secrets 时保持仓库默认模板（单占位作者）。空值自动跳过，当前最多 3 位。
      # 通过 env 传值而非内联到 run（secret 含双引号/base64，内联会破坏 bash 引号解析）。
      - name: Inject support authors
        shell: bash
        working-directory: gui
        env:
          AUTHOR_1_JSON: ${{ secrets.AUTHOR_1_JSON }}
          AUTHOR_2_JSON: ${{ secrets.AUTHOR_2_JSON }}
          AUTHOR_3_JSON: ${{ secrets.AUTHOR_3_JSON }}
          SUPPORT_NOTE: ${{ secrets.SUPPORT_NOTE }}
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          for v in "$AUTHOR_1_JSON" "$AUTHOR_2_JSON" "$AUTHOR_3_JSON"
          do
            [ -z "$v" ] || echo "$v" >> "$tmp"
          done
          if [ -s "$tmp" ]; then
            note="$SUPPORT_NOTE"
            if [ -z "$note" ]; then
              jq -s '{authors: .}' "$tmp" > public/support.json
            else
              jq -s --arg note "$note" '{authors: ., note: $note}' "$tmp" > public/support.json
            fi
          fi
          rm -f "$tmp"

      # ---- Windows：把 CI booth 三二进制放回 release target ----
      # beforeBundleCommand 钩子（gui/scripts/stage-cli.mjs）据此生成 MSI fragment / NSIS generated.nsh。
      - name: Stage booth binaries (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p target/${{ matrix.rust_target }}/release
          cp binaries/target/${{ matrix.rust_target }}/release/booth.exe \
             binaries/target/${{ matrix.rust_target }}/release/booth-mcp.exe \
             binaries/target/${{ matrix.rust_target }}/release/booth-shell.exe \
             target/${{ matrix.rust_target }}/release/

      # ---- macOS：把 CI booth/mcp 放回 release target（macOS 无 booth-shell；打包含在 Build bundle）----
      - name: Stage booth binaries (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p target/${{ matrix.rust_target }}/release
          cp binaries/booth \
             binaries/booth-mcp \
             target/${{ matrix.rust_target }}/release/

      # 注入打包版本号：release 打包的 GUI 从仓库 checkout（默认 0.0.0），
      # 必须用发布 tag（version.txt，workflow_dispatch 用输入 tag）注入 Cargo.toml，
      # 否则 GUI 装包版本与 tag 脱节（问题 3）。三二进制已由 CI 注入过版本，故只改 GUI 侧。
      # 与 ci.yml 注入规则不同：release 恒为正式 tag（无分支场景）。
      # 非发布运行（version.txt 空）：不注入，保持 0.0.0（Nightly 构建），仍产出测试包。
      - name: Inject bundle version
        shell: bash
        run: |
          set -euo pipefail
          version_file="$PWD/binaries/version.txt"
          REF=""
          if [ -f "$version_file" ] && [ -s "$version_file" ]; then
            REF=$(cat "$version_file")
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.tag }}"
          fi
          if [ -z "$REF" ]; then
            echo "无发布 tag（日常构建），跳过版本注入，保持 Nightly Build"
            echo "BUILD_SOURCE=branch" >> "$GITHUB_ENV"
            exit 0
          fi
          # 支持带 v 或不带 v 的 tag
          version="${REF#v}"
          echo "injecting bundle version: $version"
          sed -i -E "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          grep -n '^version' Cargo.toml | head -3
          # 正式发布构建来源为 tag（真实版本比较）
          echo "BUILD_SOURCE=tag" >> "$GITHUB_ENV"

      # 构建 GUI bundle：
      #   Windows：MSI/NSIS（arm64 仅 NSIS）。
      #   macOS：仅 dmg，--no-sign 跳过签名（调研决策：暂不做签名/公证，先出骨架；
      #           arm64 纯 unsigned 的 dmg 在 Apple Silicon 上会被判"已损坏"，后者待定）。
      #   --bundles dmg 收紧产物，避免多产中间 .app 目录。
      # 传 --target host 目标，产物统一落 target/{rust_target}/release/bundle/（与 Windows 对称）。
      - name: Build GUI bundle (Windows)
        if: matrix.platform == 'windows'
        working-directory: gui
        env:
          BOOTH_TARGET: ${{ matrix.rust_target }}
        run: npm run tauri build -- --target ${{ matrix.rust_target }}
      - name: Build GUI bundle (macOS)
        if: matrix.platform == 'macos'
        working-directory: gui
        env:
          BOOTH_TARGET: ${{ matrix.rust_target }}
        run: npm run tauri build -- --target ${{ matrix.rust_target }} --bundles dmg --no-sign

      # verify bundle 产物（Windows：bundle/ 整体；macOS：bundle/dmg/）
      - name: Verify bundle output
        shell: bash
        run: |
          if [ ! -d "target/${{ matrix.rust_target }}/release/bundle" ]; then
            echo "::error::bundle 产物缺失"
            find . -maxdepth 6 -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          find target/${{ matrix.rust_target }}/release/bundle -type f

      # ---- 便携版组装（仅 Windows）----

      # Lite 便携版：GUI exe + 三 CLI + portable.txt（依赖系统 WebView2）
      - name: Assemble lite portable
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p dist/lite
          GUI_BIN=target/${{ matrix.rust_target }}/release/gui.exe
          [ -f "$GUI_BIN" ] || GUI_BIN=target/${{ matrix.rust_target }}/release/booth-vault-toolhub.exe
          cp "$GUI_BIN" dist/lite/booth-vault-toolhub.exe
          cp target/${{ matrix.rust_target }}/release/booth.exe target/${{ matrix.rust_target }}/release/booth-mcp.exe target/${{ matrix.rust_target }}/release/booth-shell.exe dist/lite/
          touch dist/lite/portable.txt
          cd dist && 7z a -r -tzip booth-vault-toolhub-${{ matrix.arch }}-lite.zip lite/

      # Full 版：内置 WebView2 fixed runtime（对应架构 cab，latest）
      - name: Download WebView2 fixed runtime (latest)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/wv2" -Force | Out-Null
          gh release download --repo westinyang/WebView2RuntimeArchive `
            --pattern "Microsoft.WebView2.FixedVersionRuntime.*.${{ matrix.wv2 }}.cab" `
            --dir "$env:RUNNER_TEMP/wv2"
          New-Item -ItemType Directory -Path "dist/full/runtime" -Force | Out-Null
          $cab = (Get-ChildItem "$env:RUNNER_TEMP/wv2" -Filter "*.${{ matrix.wv2 }}.cab" | Select-Object -First 1).FullName
          if (-not $cab) { throw "WebView2 runtime cab 未下载成功" }
          & "$env:SystemRoot\System32\expand.exe" $cab -F:* "dist/full/runtime"

      - name: Assemble full portable
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p dist/full
          GUI_BIN=target/${{ matrix.rust_target }}/release/gui.exe
          [ -f "$GUI_BIN" ] || GUI_BIN=target/${{ matrix.rust_target }}/release/booth-vault-toolhub.exe
          cp "$GUI_BIN" dist/full/booth-vault-toolhub.exe
          cp target/${{ matrix.rust_target }}/release/booth.exe target/${{ matrix.rust_target }}/release/booth-mcp.exe target/${{ matrix.rust_target }}/release/booth-shell.exe dist/full/
          touch dist/full/portable.txt
          if [ -d dist/full/runtime ] && [ -n "$(ls -A dist/full/runtime 2>/dev/null)" ]; then
            mv dist/full/runtime/* dist/full/
          fi
          rm -rf dist/full/runtime
          cd dist/full && 7z a -r -tzip booth-vault-toolhub-${{ matrix.arch }}-full.zip .

      # 上传产物（带架构后缀；macOS 见下方 TODO）
      - name: Upload MSI installer
        if: matrix.msi
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-${{ matrix.platform }}-${{ matrix.arch }}-msi
          path: target/${{ matrix.rust_target }}/release/bundle/msi/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload NSIS installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-${{ matrix.platform }}-${{ matrix.arch }}-nsis
          path: target/${{ matrix.rust_target }}/release/bundle/nsis/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Lite portable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-${{ matrix.platform }}-${{ matrix.arch }}-lite
          path: dist/lite/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Full portable
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-${{ matrix.platform }}-${{ matrix.arch }}-full
          path: dist/full/**
          if-no-files-found: warn
          retention-days: 30
      # macOS：上传 dmg 安装包（unsigned，见 Build GUI bundle (macOS) 注释）
      - name: Upload dmg installer
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-${{ matrix.platform }}-${{ matrix.arch }}-dmg
          path: target/${{ matrix.rust_target }}/release/bundle/dmg/**
          if-no-files-found: error
          retention-days: 30

      # 上传发布元数据（version marker）供聚合 job 判断。仅 Windows 产物带 version.txt。
      - name: Upload release metadata
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          if [ -f binaries/version.txt ]; then
            cp binaries/version.txt release-meta.txt
          else
            echo "" > release-meta.txt
          fi
      - name: Upload release meta artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: release-meta.txt
          if-no-files-found: error
          retention-days: 3

  # 聚合发布：下载三架构全部产物，统一创建 GitHub Release
  release:
    needs: package
    runs-on: ubuntu-slim
    permissions:
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == '')
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: meta

      - name: Resolve release flags
        id: flags
        shell: bash
        run: |
          REF=$(cat meta/release-meta.txt)
          SHOULD_RELEASE="false"
          case "$REF" in
            v*) SHOULD_RELEASE="true" ;;
            *) SHOULD_RELEASE="false" ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.tag }}"
            SHOULD_RELEASE="true"
          fi
          # 不再硬编码 v0.1.0 兜底：无 tag 时保持不发布（避免撞现有 tag 的假 Release）。
          IS_PRERELEASE="false"
          case "$REF" in
            *-*) IS_PRERELEASE="true" ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            IS_PRERELEASE="true"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: booth-vault-toolhub-packages-*
          merge-multiple: true
          path: packages

      # 下载 CI 全平台 booth 二进制（Windows x64/x86/arm64 + macOS arm64/x64），
      # 作为独立 CLI 附件随 release 发布。booth-shell 仅 Windows。
      # 不用 merge-multiple：各工件（架构）保持独立子目录，避免同名二进制被覆盖。
      - name: Download booth binaries
        uses: actions/download-artifact@v4
        with:
          pattern: booth-binaries-*
          path: binaries

      - name: List packages
        shell: bash
        run: find packages binaries -type f

      # 精简：筛掉发布元数据（version.txt），只留可执行二进制。
      - name: Prepare release binaries
        shell: bash
        run: |
          find binaries -type f -name version.txt -delete
          find binaries -type f | sort

      - name: Create GitHub Release
        if: steps.flags.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.flags.outputs.tag }}
          name: ${{ steps.flags.outputs.tag }}
          prerelease: ${{ steps.flags.outputs.prerelease }}
          generate_release_notes: true
          files: |
            packages/**/*.msi
            packages/**/*.exe
            packages/**/*-lite.zip
            packages/**/*-full.zip
            packages/**/*.dmg
            binaries/**/*
