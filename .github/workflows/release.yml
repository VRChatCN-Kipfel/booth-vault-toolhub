# Release 发布：消费 CI 的三架构 booth 二进制，做最终打包（安装器 + 便携版）并发布。
#
# 职责划分：
#   CI   = 测试门控 + 构建三架构 booth 二进制（副产品，供 release 用）
#   release = 最终产物生产：tauri bundle（MSI/NSIS）+ 便携版组装 + 创建 Release
#
# CI 每架构上传 booth-binaries-{arch}（三二进制 + version.txt）。
# release 下载对应架构工件 → 本地构建 GUI → 打包安装器 + 便携版 → 聚合发布。
#
# 触发：
#   1. workflow_run：CI 完成后自动
#   2. workflow_dispatch：手动（输入 tag + 勾选 prerelease）
# 发布条件：
#   - version.txt 含 v* tag → 创建 Release（tag 含 - 为预发布）
#   - 手动触发 → 创建 Release
#   - 普通 push（version.txt 空）→ 不创建（只产成品工件）

name: release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.0.0）"
        required: false
        default: "v0.1.0"
      prerelease:
        description: "标记为预发布"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    # 仅当触发源 CI 成功时才运行（workflow_run 判断上游结论；手动触发直接跑）。
    # 防止 CI 失败或进行中时误触发发布流。
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            msvc_arch: x64
            runs_on: windows-latest
            wv2: x64
            msi: true
          - arch: x86
            rust_target: i686-pc-windows-msvc
            msvc_arch: amd64_x86
            runs_on: windows-latest
            wv2: x86
            msi: true
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            runs_on: windows-11-arm
            wv2: arm64
            msi: false
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      # 下载 CI 构建的对应架构 booth 三二进制
      - name: Download booth binaries
        uses: actions/download-artifact@v4
        with:
          name: booth-binaries-${{ matrix.arch }}
          path: binaries
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      # 配置 MSVC 开发环境（tauri build 多架构需要；x86 用 VS amd64_x86 交叉工具集）
      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend deps
        working-directory: gui
        run: npm ci

      # 把 CI booth 二进制放回 release target（供 tauri 打包时一并进安装器）
      - name: Stage booth binaries
        shell: bash
        run: |
          mkdir -p target/${{ matrix.rust_target }}/release
          cp binaries/booth.exe target/${{ matrix.rust_target }}/release/ 2>/dev/null || true
          cp binaries/booth-mcp.exe target/${{ matrix.rust_target }}/release/ 2>/dev/null || true
          cp binaries/booth-shell.exe target/${{ matrix.rust_target }}/release/ 2>/dev/null || true

      # 构建 GUI bundle（MSI/NSIS；arm64 仅 NSIS）
      - name: Build GUI bundle
        working-directory: gui
        run: npm run tauri build -- --target ${{ matrix.rust_target }}

      # 校验 bundle 产物
      - name: Verify bundle output
        shell: bash
        run: |
          if [ ! -d "target/${{ matrix.rust_target }}/release/bundle" ]; then
            echo "::error::bundle 产物缺失"
            find . -maxdepth 6 -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          find target/${{ matrix.rust_target }}/release/bundle -type f

      # ---- 便携版组装 ----

      # Lite 便携版：GUI exe + 三 CLI + portable.txt（依赖系统 WebView2）
      - name: Assemble lite portable
        shell: bash
        run: |
          mkdir -p dist/lite
          cp target/${{ matrix.rust_target }}/release/booth-keeper.exe dist/lite/ 2>/dev/null || true
          cp binaries/booth.exe dist/lite/ 2>/dev/null || true
          cp binaries/booth-mcp.exe dist/lite/ 2>/dev/null || true
          cp binaries/booth-shell.exe dist/lite/ 2>/dev/null || true
          touch dist/lite/portable.txt
          cd dist && 7z a -r -tzip booth-keeper-${{ matrix.arch }}-lite.zip lite/

      # Full 版：内置 WebView2 fixed runtime（对应架构 cab，latest）
      - name: Download WebView2 fixed runtime (latest)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/wv2" -Force | Out-Null
          gh release download --repo westinyang/WebView2RuntimeArchive `
            --pattern "Microsoft.WebView2.FixedVersionRuntime.*.${{ matrix.wv2 }}.cab" `
            --dir "$env:RUNNER_TEMP/wv2"
          New-Item -ItemType Directory -Path "dist/full/runtime" -Force | Out-Null
          $cab = (Get-ChildItem "$env:RUNNER_TEMP/wv2" -Filter "*.${{ matrix.wv2 }}.cab" | Select-Object -First 1).FullName
          Expand $cab -F:* "dist/full/runtime"

      - name: Assemble full portable
        shell: bash
        run: |
          mkdir -p dist/full
          cp target/${{ matrix.rust_target }}/release/booth-keeper.exe dist/full/ 2>/dev/null || true
          cp binaries/booth.exe dist/full/ 2>/dev/null || true
          cp binaries/booth-mcp.exe dist/full/ 2>/dev/null || true
          cp binaries/booth-shell.exe dist/full/ 2>/dev/null || true
          touch dist/full/portable.txt
          mv dist/full/runtime/* dist/full/ 2>/dev/null || true
          rm -rf dist/full/runtime
          cd dist/full && 7z a -r -tzip booth-keeper-${{ matrix.arch }}-full.zip .

      # 上传产物（带架构后缀）
      - name: Upload MSI installer
        if: matrix.msi
        uses: actions/upload-artifact@v4
        with:
          name: booth-packages-${{ matrix.arch }}-msi
          path: target/${{ matrix.rust_target }}/release/bundle/msi/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: booth-packages-${{ matrix.arch }}-nsis
          path: target/${{ matrix.rust_target }}/release/bundle/nsis/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Lite portable
        uses: actions/upload-artifact@v4
        with:
          name: booth-packages-${{ matrix.arch }}-lite
          path: dist/lite/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Full portable
        uses: actions/upload-artifact@v4
        with:
          name: booth-packages-${{ matrix.arch }}-full
          path: dist/full/**
          if-no-files-found: warn
          retention-days: 30

      # 上传发布元数据（version marker）供聚合 job 判断
      - name: Upload release metadata
        shell: bash
        run: |
          if [ -f binaries/version.txt ]; then
            cp binaries/version.txt release-meta.txt
          else
            echo "" > release-meta.txt
          fi
      - name: Upload release meta artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: release-meta.txt
          if-no-files-found: error
          retention-days: 3

  # 聚合发布：下载三架构全部产物，统一创建 GitHub Release
  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release metadata
        uses: actions/download-artifact@v4
        with:
          name: release-meta
          path: meta

      - name: Resolve release flags
        id: flags
        shell: bash
        run: |
          REF=$(cat meta/release-meta.txt)
          SHOULD_RELEASE="false"
          case "$REF" in
            v*) SHOULD_RELEASE="true" ;;
            *) SHOULD_RELEASE="false" ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.tag }}"
            SHOULD_RELEASE="true"
          fi
          if [ -z "$REF" ]; then REF="v0.1.0"; fi
          IS_PRERELEASE="false"
          case "$REF" in
            *-*) IS_PRERELEASE="true" ;;
          esac
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            IS_PRERELEASE="true"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: booth-packages-*
          merge-multiple: true
          path: packages

      - name: List packages
        shell: bash
        run: find packages -type f

      - name: Create GitHub Release
        if: steps.flags.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.flags.outputs.tag }}
          name: ${{ steps.flags.outputs.tag }}
          prerelease: ${{ steps.flags.outputs.prerelease }}
          generate_release_notes: true
          files: |
            packages/**/*.msi
            packages/**/*.exe
            packages/**/*-lite.zip
            packages/**/*-full.zip
