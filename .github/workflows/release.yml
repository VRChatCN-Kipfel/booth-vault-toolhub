# Release 发布：无条件构建并上传可用成品，仅 tag v* 或手动触发时创建 GitHub Release。
#
# 触发方式：
#   1. workflow_run：每次 CI 完成后自动运行（无条件构建 + 上传 booth-packages 成品）
#   2. workflow_dispatch：手动触发（输入 tag + 勾选 prerelease）
#
# 发布条件：
#   - CI 由 tag v* 触发时，version.txt 含 tag 名 → 创建 Release（tag 含 - 为预发布）
#   - 手动触发 → 创建 Release（用输入 tag；勾选 prerelease 则预发布）
#   - 普通 push 的 CI（version.txt 空）→ 只上传成品，不创建 Release
#
# 说明：
# - workspace 统一 target 到根目录，bundle 产物在 target/release/bundle/。
# - 成品工件 booth-packages 无条件上传，便于随时取用。

name: release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v1.0.0）"
        required: false
        default: "v0.1.0"
      prerelease:
        description: "标记为预发布"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 解析版本号与是否应发布
      # workflow_run：读上游 CI run 的 booth-binaries 工件里的 version.txt
      # （tag 触发时 CI 写入 tag 名，否则空 → 不发布）
      # 手动触发：用输入 tag，必发布
      - name: Download version marker
        uses: actions/download-artifact@v4
        with:
          name: booth-binaries
          path: /tmp/ci-artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
        continue-on-error: true

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          SHOULD_RELEASE="false"
          REF=""
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ -f /tmp/ci-artifacts/version.txt ]; then
              REF=$(cat /tmp/ci-artifacts/version.txt)
            fi
            # 仅合法 v* tag 才发布
            case "$REF" in
              v*) SHOULD_RELEASE="true" ;;
              *) SHOULD_RELEASE="false" ;;
            esac
          else
            REF="${{ github.event.inputs.tag }}"
            SHOULD_RELEASE="true"
          fi
          if [ -z "$REF" ]; then REF="v0.1.0"; fi
          # 预发布：tag 含 '-'（semver 预发布段）
          IS_PRERELEASE="false"
          case "$REF" in
            *-*) IS_PRERELEASE="true" ;;
          esac
          # 手动触发勾选 prerelease 时强制预发布
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            IS_PRERELEASE="true"
          fi
          echo "tag=$REF" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "解析结果: tag=$REF should_release=$SHOULD_RELEASE prerelease=$IS_PRERELEASE"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend deps
        working-directory: gui
        run: npm ci

      # 构建 booth 三二进制（根 workspace target）
      - name: Build booth binaries
        run: cargo build --release --workspace

      # 构建前端 + tauri bundle（NSIS 安装包；产物在根 target/release/bundle/）
      - name: Build GUI bundle
        working-directory: gui
        run: npm run tauri build

      # 校验 bundle 产物存在（workspace 统一 target 到根目录）
      - name: Verify bundle output
        shell: bash
        run: |
          if [ ! -d "target/release/bundle" ]; then
            echo "::error::bundle 产物缺失: target/release/bundle 不存在（tauri target 路径不符）"
            find . -maxdepth 5 -type d -name bundle 2>/dev/null || true
            exit 1
          fi
          echo "bundle 产物:"
          find target/release/bundle -type f

      # ---- 组装四份发布产物 ----

      # Lite 便携版：GUI exe + 三 CLI 二进制，打进一个目录（Artifacts 自动 zip）
      # 依赖目标环境的 WebView2（Windows 10 1803+ 已内置）
      - name: Assemble lite portable
        shell: bash
        run: |
          mkdir -p dist/lite
          cp target/release/booth-keeper.exe dist/lite/ 2>/dev/null || true
          cp target/release/booth.exe dist/lite/ 2>/dev/null || true
          cp target/release/booth-mcp.exe dist/lite/ 2>/dev/null || true
          cp target/release/booth-shell.exe dist/lite/ 2>/dev/null || true
          # 附带 GUI 前端资源（Tauri 独立运行所需，若有则复制）
          if [ -d "target/release/bundle/resources" ]; then
            cp -r target/release/bundle/resources dist/lite/
          fi
          # 打成便携 zip（release assets 需文件）
          cd dist && zip -r booth-keeper-lite.zip lite/

      # Full 版：内置 WebView2 fixed runtime，完全不依赖外部环境。
      # 下载官方 Fixed Version runtime cab（社区存档 URL 可预测），解包到 exe 旁；
      # GUI main() 启动时探测该文件夹并设 WEBVIEW2_BROWSER_EXECUTABLE_FOLDER。
      - name: Download WebView2 fixed runtime
        shell: pwsh
        run: |
          $arch = "x64"
          $ver  = "133.0.3065.92"
          $cab  = "Microsoft.WebView2.FixedVersionRuntime.$ver.$arch.cab"
          Invoke-WebRequest -Uri "https://github.com/westinyang/WebView2RuntimeArchive/releases/download/$ver/$cab" -OutFile "$env:RUNNER_TEMP/$cab"
          New-Item -ItemType Directory -Path "dist/full/runtime" -Force | Out-Null
          Expand $env:RUNNER_TEMP/$cab -F:* "dist/full/runtime"

      - name: Assemble full portable
        shell: bash
        run: |
          mkdir -p dist/full
          cp target/release/booth-keeper.exe dist/full/ 2>/dev/null || true
          cp target/release/booth.exe dist/full/ 2>/dev/null || true
          cp target/release/booth-mcp.exe dist/full/ 2>/dev/null || true
          cp target/release/booth-shell.exe dist/full/ 2>/dev/null || true
          # runtime 解包产物移到 exe 同级（探测逻辑扫描 exe 目录）
          mv dist/full/runtime/* dist/full/ 2>/dev/null || true
          rm -rf dist/full/runtime
          # 重命名为可预测的固定名（探测逻辑匹配 Microsoft.WebView2.FixedVersionRuntime.*）
          cd dist/full && zip -r booth-keeper-full.zip .

      # 上传四份产物（无条件）——即使不发布也保留供即时测试
      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-msi
          path: target/release/bundle/msi/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-nsis
          path: target/release/bundle/nsis/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Lite portable
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-lite
          path: dist/lite/**
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Full portable
        uses: actions/upload-artifact@v4
        with:
          name: booth-vault-toolhub-packages-full
          path: dist/full/**
          if-no-files-found: warn
          retention-days: 30

      # 创建 GitHub Release（仅 tag v* 或手动触发）
      - name: Create GitHub Release
        if: steps.ver.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          generate_release_notes: true
          files: |
            target/release/bundle/msi/**/*.msi
            target/release/bundle/nsis/**/*.exe
            dist/booth-keeper-lite.zip
            dist/booth-keeper-full.zip
