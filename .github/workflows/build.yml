# BOOTH 工具统一构建（M7 打包用）
#
# 支持作者栏位注入说明（工作流 secrets）：
#
#   support.json 由仓库模板 gui/public/support.json 提交，build 前用 secrets 覆盖。
#   每个作者 = 一个 secret（值为其完整 raw JSON，图片 base64 内嵌为 data: URL）：
#
#     AUTHOR_1_JSON: {"name":"主上","title":"LinnYue","url":"https://afdian.com/a/LinnYue","desc":"...","image":"data:image/png;base64,iVBORw0KGgo..."}
#     AUTHOR_2_JSON: {"name":"作者B","url":"...","image":"data:image/png;base64,..."}
#
#   生成 secrets 的命令（本地把二维码转 JSON 一行）：
#     base64 -w0 qr_alice.png | awk '{printf "{\"name\":\"主上\",\"image\":\"data:image/png;base64,%s\"}", $0}'
#
#   新增作者：新增一个 secret + 在下方 jq 数组加一行 ${{ secrets.AUTHOR_N_JSON }}。
#   应用端按注入顺序渲染（不在数据中硬编码排序）。

name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend deps
        working-directory: gui
        run: npm ci

      # ---- 支持作者栏位注入（注释说明，待信息收集后启用）----
      # 从 secrets 组装 support.json，覆盖仓库模板后打包。
      # 未配置 secrets 时跳过此步，使用仓库默认模板（单占位作者）。
      # - name: Inject support authors
      #   working-directory: gui
      #   run: |
      #     jq -n \
      #       '{authors: [
      #         ${{ secrets.AUTHOR_1_JSON }},
      #         ${{ secrets.AUTHOR_2_JSON }}
      #       ], note: "赞助全部用于支付 LLM API 费用 + 服务器"}'
      #       > public/support.json
      # ----------------------------------------------------------

      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace

      - name: Build frontend
        working-directory: gui
        run: npm run build

      - name: Build GUI bundle
        working-directory: gui
        run: npm run tauri build
