name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Windows 主目标：全 workspace 编译 + 测试 + lint + 构建 + 上传产物
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend deps
        working-directory: gui
        run: npm ci
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (workspace)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (workspace)
        run: cargo test --workspace
      - name: Build frontend
        working-directory: gui
        run: npm run build

      # 构建 booth 三二进制（根 workspace target）——push/PR/tag/手动都会构建上传，
      # 便于任何人随时取用即时测试产物。
      - name: Build booth binaries
        run: cargo build --release --workspace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: booth-binaries
          path: |
            target/release/booth.exe
            target/release/booth-mcp.exe
            target/release/booth-shell.exe
          if-no-files-found: warn
          retention-days: 14

  # Linux / macOS 门控：engine 层三平台跑测试。
  # 非主目标，失败不阻塞 CI 整体（Windows 主目标结果为准）。
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (engine)
        run: cargo clippy -p engine --all-targets --all-features -- -D warnings
      - name: Test (engine)
        run: cargo test -p engine
