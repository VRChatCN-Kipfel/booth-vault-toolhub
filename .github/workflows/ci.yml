name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 编码契约（前置门控）：本次变更涉及的 tracked 文本文件必须严格为 UTF-8 且无 BOM。
  # 只扫 diff 内文件（PR 取 merge-base 三点 diff，push 取 before..HEAD，拿不到基线则全量兜底）；
  # gitattributes 只管行尾，UTF-8 合法性与 BOM 由本步把关（曾因 dependabot.yml 带 BOM 致配置校验失败）。
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject non-UTF-8 / UTF-8 BOM in changed text files
        shell: bash
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-list --max-parents=0 HEAD)
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD)
          else
            files=$(git diff --name-only --diff-filter=ACMRT "$base" HEAD)
          fi
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git check-attr binary -- "$f" | grep -q ': set'; then
              continue
            fi
            first=$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$first" = "efbbbf" ]; then
              echo "::error file=$f::UTF-8 BOM (EF BB BF) at file start"
              fail=1
            fi
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not strictly valid UTF-8"
              fail=1
            fi
          done <<< "$files"
          exit $fail

  # Windows 主目标：三架构（x64/x86/arm64）全量构建 + 测试 + 上传产物。
  # 产物（booth 三二进制 + tauri bundle + 便携版）供 release 聚合发布。
  windows:
    needs: encoding
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64/x86 在 x64 runner 上编译（x86 用 VS amd64_x86 交叉工具集）
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            msvc_arch: x64
            runs_on: windows-latest
            wv2: x64
          - arch: x86
            rust_target: i686-pc-windows-msvc
            msvc_arch: amd64_x86
            runs_on: windows-latest
            wv2: x86
          # arm64 用原生 arm64 runner（VS 2022 Enterprise，工具链齐全）
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            runs_on: windows-11-arm
            wv2: arm64
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      # 配置 MSVC 开发环境（vcvarsall 官方 PATH/INCLUDE/LIB；
      # 复用 VS 自带工具集，避免 Git Bash /usr/bin/link.exe 遮蔽）
      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend deps
        working-directory: gui
        run: npm ci
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (workspace)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (workspace)
        run: cargo test --workspace
      - name: Build frontend
        working-directory: gui
        run: npm run build

      # 注入构建版本号到根 Cargo.toml（workspace 唯一源，各 crate 自动跟随）。
      # 规则：
      #   - tag 触发：直接用 tag 版本（去 v 前缀），如 v1.0.0 → 1.0.0
      #   - 非 tag：取当前分支最近 tag（git describe），拼 {tag}-{shorthash}，如 1.2.3-f3ab2c1
      #   - 无 tag：用分支名清洗为纯 ASCII（/ 反斜杠 → '-'，连续 '-' 压缩，
      #     非 [A-Za-z0-9.-] 替换为 '-'，trim 两端 '-'；中文丢弃），拼 -{shorthash}
      #     若清洗后不以「数字.数字」开头（非法 semver，如 PR 的 24/merge → 24-merge、
      #     字母开头分支），补 0.0.0- 前缀保证可编译（如 0.0.0-24-merge）。
      #     显示层剥离 0.0.0- 前缀，见 update::display_version。
      # 默认仓库版本为 0.0.0（Nightly Build），注入后产物内嵌真实来源版本。
      # 非 tag 构建同时设 BUILD_SOURCE=branch（经 $GITHUB_ENV 供后续 build 步骤读取，
      # build.rs 据此写 BOOTH_BUILD_SOURCE 编译期常量，update 比较时按 0.0.0 恒提示
      # 正式版可更新，避免分支里的数字被误判为已最新）。
      - name: Inject build version
        shell: bash
        run: |
          set -euo pipefail
          source_kind="tag"
          version=""
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
            version="${version#v}"
          else
            source_kind="branch"
            sha="${{ github.sha }}"
            shorthash="${sha:0:7}"
            last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
            if [ -n "$last_tag" ]; then
              last_tag="${last_tag#v}"
              version="${last_tag}-${shorthash}"
            else
              # PR 时 head_ref 为真实分支名（ref_name 是 NN/merge），优先用 head_ref。
              branch="${{ github.head_ref }}"
              [ -n "$branch" ] || branch="${{ github.ref_name }}"
              # 清洗分支名为纯 ASCII semver 兼容片段
              clean=$(printf '%s' "$branch" | sed 's/[\\/]/-/g; s/[^A-Za-z0-9.-]/-/g; s/--*/-/g; s/^-//; s/-$//')
              [ -n "$clean" ] || clean="nightly"
              # 以「数字.数字」开头视为合法版本基座；否则补 0.0.0- 前缀
              if printf '%s' "$clean" | grep -qE '^[0-9]+\.[0-9]+'; then
                version="${clean}-${shorthash}"
              else
                version="0.0.0-${clean}-${shorthash}"
              fi
            fi
          fi
          echo "injecting version: $version (source=$source_kind)"
          # 写回根 Cargo.toml 的 version = "..."
          sed -i -E "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          grep -n '^version' Cargo.toml | head -3
          echo "BUILD_SOURCE=$source_kind" >> "$GITHUB_ENV"

      # 构建 booth 三二进制（目标架构，验证可编译；供 release 打包用）
      - name: Build booth binaries
        run: cargo build --release --target ${{ matrix.rust_target }} --workspace

      # 记录版本元数据：仅 tag 触发时写入 tag 名
      - name: Write version marker
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ github.ref_name }}" > version.txt
          else
            echo "" > version.txt
          fi

      # 上传 booth 三二进制（统一命名：booth-binaries-{平台}-{架构}；含 version.txt）
      # release 工作流下载后做最终打包（tauri bundle + 便携版）
      - name: Upload booth binaries
        uses: actions/upload-artifact@v4
        with:
          name: booth-binaries-windows-${{ matrix.arch }}
          path: |
            version.txt
            target/${{ matrix.rust_target }}/release/booth.exe
            target/${{ matrix.rust_target }}/release/booth-mcp.exe
            target/${{ matrix.rust_target }}/release/booth-shell.exe
          if-no-files-found: warn
          retention-days: 14

  # macOS：正式产物 job（非仅门控）。由于 macOS 已产出实际 booth 二进制，
  # 直接作为一等编译来源：arm64 / x64 编译 + 测试 + clippy + 构建上传 booth 二进制。
  # 与 windows job 平级，均为 release 分发源；本 job 失败即阻塞合并。
  macos:
    needs: encoding
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            rust_target: aarch64-apple-darwin
            artifact: booth-binaries-macos-arm64
          - os: macos-26-intel
            arch: x64
            rust_target: x86_64-apple-darwin
            artifact: booth-binaries-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      # shell_win/shell_mac 依赖已按 target 门控，macOS 可完整编译检查（含 booth-shell 的 shell_mac 分支）
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test (workspace)
        run: cargo test --workspace

      # 编译 macOS booth 二进制（booth + booth-mcp；booth-shell 跨平台独立 crate，仅 Windows 分发）
      - name: Build booth binaries
        shell: bash
        run: |
          cargo build --release --workspace
          mkdir -p stage
          cp target/release/booth stage/
          cp target/release/booth-mcp stage/
      - name: Upload booth binaries (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: stage/**
          if-no-files-found: error
          retention-days: 14

  # Ubuntu：仅门控（Linux 不是目标分发平台，不产工件）。失败不阻塞合并。
  portable:
    needs: encoding
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (engine)
        run: cargo clippy -p engine --all-targets --all-features -- -D warnings
      - name: Test (engine)
        run: cargo test -p engine
