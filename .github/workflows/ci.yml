name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # 编码契约（前置门控）：本次变更涉及的 tracked 文本文件必须严格为 UTF-8 且无 BOM。
  # 只扫 diff 内文件（PR 取 merge-base 三点 diff，push 取 before..HEAD，拿不到基线则全量兜底）；
  # gitattributes 只管行尾，UTF-8 合法性与 BOM 由本步把关（曾因 dependabot.yml 带 BOM 致配置校验失败）。
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject non-UTF-8 / UTF-8 BOM in changed text files
        shell: bash
        run: |
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base=$(git rev-list --max-parents=0 HEAD)
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only --diff-filter=ACMRT "$base"...HEAD)
          else
            files=$(git diff --name-only --diff-filter=ACMRT "$base" HEAD)
          fi
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if git check-attr binary -- "$f" | grep -q ': set'; then
              continue
            fi
            first=$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$first" = "efbbbf" ]; then
              echo "::error file=$f::UTF-8 BOM (EF BB BF) at file start"
              fail=1
            fi
            if ! iconv -f UTF-8 -t UTF-8 "$f" >/dev/null 2>&1; then
              echo "::error file=$f::not strictly valid UTF-8"
              fail=1
            fi
          done <<< "$files"
          exit $fail

  # Windows 主目标：三架构（x64/x86/arm64）全量构建 + 测试 + 上传产物。
  # 产物（booth 三二进制 + tauri bundle + 便携版）供 release 聚合发布。
  windows:
    needs: encoding
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64/x86 在 x64 runner 上编译（x86 用 VS amd64_x86 交叉工具集）
          - arch: x64
            rust_target: x86_64-pc-windows-msvc
            msvc_arch: x64
            runs_on: windows-latest
            wv2: x64
          - arch: x86
            rust_target: i686-pc-windows-msvc
            msvc_arch: amd64_x86
            runs_on: windows-latest
            wv2: x86
          # arm64 用原生 arm64 runner（VS 2022 Enterprise，工具链齐全）
          - arch: arm64
            rust_target: aarch64-pc-windows-msvc
            msvc_arch: arm64
            runs_on: windows-11-arm
            wv2: arm64
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      # 配置 MSVC 开发环境（vcvarsall 官方 PATH/INCLUDE/LIB；
      # 复用 VS 自带工具集，避免 Git Bash /usr/bin/link.exe 遮蔽）
      - name: Enable Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - name: Install frontend deps
        working-directory: gui
        run: npm ci
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (workspace)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test (workspace)
        run: cargo test --workspace
      - name: Build frontend
        working-directory: gui
        run: npm run build

      # 构建 booth 三二进制（目标架构，验证可编译；供 release 打包用）
      - name: Build booth binaries
        run: cargo build --release --target ${{ matrix.rust_target }} --workspace

      # 记录版本元数据：仅 tag 触发时写入 tag 名
      - name: Write version marker
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "${{ github.ref_name }}" > version.txt
          else
            echo "" > version.txt
          fi

      # 上传 booth 三二进制（带架构后缀；含 version.txt）
      # release 工作流下载后做最终打包（tauri bundle + 便携版）
      - name: Upload booth binaries
        uses: actions/upload-artifact@v4
        with:
          name: booth-binaries-${{ matrix.arch }}
          path: |
            version.txt
            target/${{ matrix.rust_target }}/release/booth.exe
            target/${{ matrix.rust_target }}/release/booth-mcp.exe
            target/${{ matrix.rust_target }}/release/booth-shell.exe
          if-no-files-found: warn
          retention-days: 14

  # Linux / macOS 门控：engine 层三平台跑测试（非主目标，失败不阻塞）
  portable:
    needs: encoding
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy (engine)
        run: cargo clippy -p engine --all-targets --all-features -- -D warnings
      - name: Test (engine)
        run: cargo test -p engine
