[package]
name = "shell_win"
description = "Windows Shell 专属模块：文件夹图标三件套、属性位、SHChangeNotify（仅 Windows）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["windows-shell"]
# 平台门控：macOS/Linux 关闭该 feature 即退化为无文件夹图标功能
windows-shell = []

[[bin]]
name = "booth-shell"
path = "src/bin/booth_shell.rs"

[dependencies]
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(target_os = "macos")'.dependencies]
shell_mac = { path = "../shell_mac" }
