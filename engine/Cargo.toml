[package]
name = "engine"
description = "BOOTH 工具核心引擎：纯函数层（分类/清洗/评分/解析），三端共享"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]

[[bin]]
name = "booth"
path = "src/bin/booth.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
cookie_store = "0.22"
dirs = "6"
encoding_rs = "0.8"
fancy-regex = "0.16"
phf = { version = "0.13", features = ["macros"] }
reqwest = { version = "0.13", features = ["blocking", "json", "cookies", "http2", "system-proxy", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
unicode-general-category = "1.1"

[target.'cfg(windows)'.dependencies]
shell_win = { path = "../shell_win" }
